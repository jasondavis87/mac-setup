name: ai-stack
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    restart: unless-stopped
    environment:
      # Point to host-native Ollama (launchd agent) from inside the container
      - OLLAMA_BASE_URL=http://host.docker.internal:11434

      # Enable single user mode (no authentication required)
      - WEBUI_AUTH=false

      # === Local image generation via host-native Ollama ===
      # Ollama exposes an OpenAI-compatible /v1/images/generations endpoint, so
      # Open WebUI's "openai" image engine drives it directly. The API key is a
      # required-but-ignored dummy (Ollama doesn't auth). Pull the model on the
      # host first: `ollama pull x/z-image-turbo` (see README AI Stack section).
      # NOTE: these are PersistentConfig — on an EXISTING install they only seed
      # if image gen was never configured in the Admin UI; on a fresh DB they
      # apply on first boot. To force a re-seed, set ENABLE_PERSISTENT_CONFIG=False.
      - ENABLE_IMAGE_GENERATION=True
      - IMAGE_GENERATION_ENGINE=openai
      - IMAGES_OPENAI_API_BASE_URL=http://host.docker.internal:11434/v1
      - IMAGES_OPENAI_API_KEY=ollama
      - IMAGE_GENERATION_MODEL=x/z-image-turbo
      # 512px ~25s; bump to 1024x1024 (~2 min) in Admin > Settings > Images for
      # final quality. Ollama's MLX image runner is experimental and ~10x slower
      # per step than a tuned pipeline, so resolution is the main speed lever.
      - IMAGE_SIZE=512x512
      - IMAGE_STEPS=9

      # Enable built-in RAG web search via SearXNG
      - ENABLE_WEB_SEARCH=True
      - WEB_SEARCH_RESULT_COUNT=6
      - WEB_LOADER_CONCURRENT_REQUESTS=10
      - WEB_SEARCH_ENGINE=searxng
      # Use JSON format from SearXNG with <query>
      - SEARXNG_QUERY_URL=http://searxng:8080/search?format=json&q=<query>

    volumes:
      - ./config/open-webui:/app/backend/data
    extra_hosts:
      - host.docker.internal:host-gateway
    # uncomment to expose to host (using orbstack's proxying feature)
    # ports:
    #   - "8080:8080"  # Open WebUI on host http://localhost:8080
    depends_on:
      - searxng

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    volumes:
      # Mount custom settings.yml into /etc/searxng/settings.yml
      - ./config/searxng:/etc/searxng
    extra_hosts:
      - host.docker.internal:host-gateway
    # uncomment to expose to host
    # ports:
    #   - "8081:8080"  # Host access at http://localhost:8081, container name is searxng:8080

  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup open-webui searxng
    depends_on:
      - open-webui
      - searxng
